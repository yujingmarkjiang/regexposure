# =============================================================================
# Firm regulatory exposure from 10-K and Federal Register texts -- configuration
# =============================================================================

project:
  data_dir: data
  start_year: 2000
  end_year: 2025

# ----------------------------------------------------------------------------- OpenAI
openai:
  key_file: OpenAI.key                  # one line containing the API key; listed in .gitignore
  model: gpt-5.6-terra                  # GPT-5.6 Terra: extraction, cluster labels and domain scoring
  embedding_model: text-embedding-3-large
  embedding_dim: 3072
  reasoning_effort:                     # one setting per step, identical for every document
    extraction: low
    labeling: medium
    scoring: medium
  max_output_tokens: 16000              # includes reasoning tokens
  store: false                          # do not retain responses on OpenAI's side
  max_workers: 8                        # parallel synchronous requests
  max_retries: 6
  timeout_s: 900
  use_batch: false                      # true: OpenAI Batch API (lower price, results within 24 h)
  batch_max_requests: 40000
  batch_max_mb: 180
  batch_poll_seconds: 120
  price_per_million:                    # USD, for `score --dry-run` estimates; check current pricing
    input: 2.50
    output: 15.00

# ----------------------------------------------------------------------------- Data
sec:
  user_agent: "Your Name your.email@example.edu"   # REQUIRED by the SEC: replace with your name and email
  forms: ["10-K", "10-K405", "10-KSB", "10-KT"]
  include_amendments: false
  fiscal_year_rule: period_end_year     # or "compustat" (fiscal years ending Jan-May -> previous year)
  requests_per_second: 8                # SEC fair-access limit is 10

federal_register:
  document_types: [RULE, PRORULE]       # final and proposed rules
  download_workers: 4

# ----------------------------------------------------------------------------- Steps
extraction:                             # LLM-guided location and cleaning of Item 1 / Item 1A
  max_heading_lines: 1500
  max_repeated_lines: 80
  min_section_chars: 500
  chunk_size: 2000

embedding:
  tokenizer: cl100k_base                # tokenizer of text-embedding-3-large
  max_tokens_per_chunk: 8000            # model limit is 8,191 tokens per input
  max_inputs_per_request: 256
  max_tokens_per_request: 250000
  shard_size: 2000

domains:
  k: 20                                 # number of clusters = number of domains
  seed: 42
  fit_sample: 200000                    # documents used to fit the clustering
  balance_corpora: true                 # equal numbers of rules and 10-K sections in the fit sample
  pca_dims: 256
  n_init: 10
  label_examples: 24                    # example texts the model reads per cluster
  label_chars_per_example: 1500

scoring:
  tokenizer: o200k_base
  max_input_tokens: 400000              # longer texts are scored in parts; domain score = max over parts
  part_overlap_tokens: 2000
  chunk_size: 2000

linking:
  window_years_before: 2                # rules published in fiscal years t-2 ... t are paired with firm-year t
  window_years_after: 0
  firm_profile: max                     # Firm_{f,d} = max(Business, Risk Factors); or mean, business, risk
  agency_allocation: equal_split        # joint rules split across agencies; or "full"
  store_pairs: positive                 # positive | all | none
  firm_chunk: 64
